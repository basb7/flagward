project: flagward
context: |
  Django 6.1 + DRF 3.18 backend (Python 3.14) for a feature-flags SaaS.
  Apps: core, core_flags, authentication, analytics, sdk_api, config (settings).
  Next.js 16 / React 19 / TypeScript frontend under frontend/ (Biome, Tailwind v4).
  API convention: <app>/api/{views,serializers,urls}.py (authentication is an exception).
  JWT auth (simplejwt), Redis-backed SSE for flag change notifications.

strict_tdd: true

testing:
  runner: pytest
  command: pytest
  framework: pytest
  venv: .venv (python3.14; pytest/ruff available as .venv/bin/pytest, .venv/bin/ruff)
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: coverage run -m pytest && coverage report
  quality:
    linter: ruff check .
    type_checker: none (not configured; no mypy in requirements/venv despite earlier draft)
    formatter: ruff format .

frontend_testing:
  lint: npm run lint (frontend/, runs biome check .)
  build: npm run build (frontend/, next build)
  ci_authoritative: .github/workflows/ci.yml — jobs "Backend (lint + tests)" (pip install -r requirements/dev.txt; ruff check .; pytest) and "Frontend (lint + build)" (npm ci; npm run lint; npm run build)

phases:
  proposal:
    required_inputs:
      - exploration
    outputs:
      - proposal
  spec:
    required_inputs:
      - proposal
    outputs:
      - spec
  design:
    required_inputs:
      - proposal
    outputs:
      - design
  tasks:
    required_inputs:
      - spec
      - design
    outputs:
      - tasks
  apply:
    required_inputs:
      - tasks
      - spec
      - design
    outputs:
      - apply_progress
  verify:
    required_inputs:
      - spec
      - tasks
      - apply_progress
    outputs:
      - verify_report
  archive:
    required_inputs: all
    outputs:
      - archive_report
