name: Bug report
description: Report something that is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security
        vulnerabilities — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a flag with ...
        2. Call GET /api/...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "main @ 2f7bae4"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - SDK API or SSE
        - Dashboard (frontend)
        - Docker / deployment
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, Docker or local.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
    validations:
      required: false
