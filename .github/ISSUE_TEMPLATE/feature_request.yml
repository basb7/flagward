name: Feature request
description: Propose a change or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** first. Agreement on the problem makes reviewing
        the solution much faster.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits it, how often, and what do they do today instead?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Flagward to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
          required: false
