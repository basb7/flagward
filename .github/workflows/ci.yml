name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    # Production runs Postgres (compose.yml). Without this service the suite falls
    # through to the SQLite branch in config/settings.py, and constraint-altering
    # migrations are exactly where the two engines diverge.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flagward
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: flagward
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Added alongside the two jobs above, never in place of them: main's ruleset
  # requires "Backend (lint + tests)" and "Frontend (lint + build)" by exact
  # name, so renaming either one would make every pull request unmergeable.
  e2e:
    name: E2E (onboarding chain)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The suite drives the real product, so it needs the real stack:
      # Postgres, Redis, Django and Next.js, exactly as a contributor runs it.
      - name: Start the stack
        run: docker compose -f compose.dev.yml up -d --build

      # Polled, not slept: the frontend image builds Next.js at image-build
      # time but the container still needs a moment to listen, and a fixed
      # sleep is either flaky or wasteful. `curl --fail` treats a 5xx as
      # not-ready, which is what "the API is up but migrations are still
      # running" looks like.
      - name: Wait for the stack to be ready
        run: |
          for service in \
            'API|http://localhost:8000/api/v1/health/' \
            'dashboard|http://localhost:3000/login'
          do
            name="${service%%|*}"
            url="${service#*|}"
            echo "Waiting for $name at $url"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --output /dev/null "$url"; then
                echo "$name is ready after ${attempt}s"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::$name never became ready at $url"
                docker compose -f compose.dev.yml ps
                docker compose -f compose.dev.yml logs --no-color --tail 200
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run the end-to-end suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose -f compose.dev.yml logs --no-color --tail 400

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.dev.yml down -v
